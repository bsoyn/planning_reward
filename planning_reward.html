<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5fc7">
<title>갓생 포인트</title>
<style>
:root{
  --bg:#ffffff; --panel:#fafafa; --card:#ffffff;
  --ink:#1a1a1c; --sub:#9a9aa2;
  --accent:#1a1a1c; --accent2:#3a3a40; --soft:#f1f1f3;
  --gold:#a9812f; --green:#4c8f6d; --red:#c25b5b;
  --line:#ececee; --shadow:none;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em}
#app{max-width:540px; margin:0 auto; padding:16px 16px 88px}
h2{font-size:17px; font-weight:700; margin:20px 0 12px; letter-spacing:-0.02em}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:none; padding:16px; margin-bottom:12px}
.row{display:flex; align-items:center; gap:8px}
.grow{flex:1}
.sub{color:var(--sub); font-size:12.5px}
.pts{color:var(--gold); font-weight:700}
button{font-family:inherit; border:1px solid var(--accent); border-radius:var(--r-sm); padding:9px 14px; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; transition:opacity .15s}
button:hover{opacity:.88}
button.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
button.gray{background:var(--soft); color:#6a6a72; border-color:transparent}
button.danger{background:transparent; color:var(--red); border-color:var(--line)}
button.small{padding:5px 11px; font-size:12.5px; border-radius:7px}
button:disabled{opacity:.4; cursor:default}
input,select{font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff; color:var(--ink); width:100%; transition:border-color .15s}
input:focus,select:focus{outline:none; border-color:var(--ink)}
label{font-size:12px; color:var(--sub); font-weight:600; display:block; margin:12px 0 5px; letter-spacing:0}

/* header */
.hero{background:#f4f4f8; border:1px solid var(--line); color:var(--ink); border-radius:14px; padding:18px; margin-bottom:14px}
.hero .big{font-size:30px; font-weight:800; letter-spacing:-0.02em}
.hero .lv{font-size:13px; color:var(--sub); margin-top:3px}
.bar{height:6px; background:#e6e6ea; border-radius:3px; margin-top:11px; overflow:hidden}
.bar>div{height:100%; background:var(--ink); border-radius:3px}
.badges{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
.badge{background:#fff; border:1px solid var(--line); color:#6a6a72; border-radius:7px; padding:4px 10px; font-size:12px}

/* tabs */
nav{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.92); backdrop-filter:saturate(180%) blur(12px); border-top:1px solid var(--line); display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom)}
nav>div{max-width:540px; margin:0 auto; display:flex; flex:1}
nav button{flex:1; background:none; color:var(--sub); font-size:11px; padding:9px 0 10px; border:none; border-radius:0; font-weight:600; display:flex; flex-direction:column; gap:3px; align-items:center}
nav button:hover{opacity:1}
nav button .ic{font-size:19px}
nav button.on{color:var(--ink)}

/* plan items */
.plan{display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:none}
.plan .t{font-weight:600; font-size:14.5px}
.plan.done .t{text-decoration:line-through; color:var(--sub)}
.chip{display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; background:var(--soft); color:#6a6a72; margin-right:4px; font-weight:600}
.chip.time{background:var(--soft); color:var(--gold)}
.chip.d1{background:var(--soft); color:var(--green)} .chip.d2{background:var(--soft); color:var(--gold)} .chip.d3{background:var(--soft); color:var(--red)}

.daybtns{display:flex; gap:5px; margin-top:5px}
.daybtns button{flex:1; padding:7px 0; font-size:12.5px; background:var(--soft); color:#8a8a92; border-color:transparent; border-radius:7px}
.daybtns button.on{background:var(--accent); color:#fff; border-color:var(--accent)}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:90px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 6px 24px rgba(0,0,0,.18); z-index:99; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; line-height:1.5}
.toast.show{opacity:1}
.empty{text-align:center; color:var(--sub); padding:28px 0; font-size:13.5px}
.stat3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.stat3 .card{text-align:center; margin:0; padding:14px 6px}
.stat3 .n{font-size:20px; font-weight:800; letter-spacing:-0.02em}
.hist{font-size:13px; padding:9px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px}
.hist:last-child{border:none}
details summary{cursor:pointer; font-weight:600; font-size:14px; padding:5px 0}
.hidden{display:none}

/* 프로젝트 진행률 바, 완료 입력 폼 */
.pbar{height:6px; background:var(--soft); border-radius:3px; margin-top:8px; overflow:hidden}
.pbar>div{height:100%; background:var(--accent); border-radius:3px}
.cform{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; margin:5px 0 8px}
.cform label{margin-top:0}
.msrow input{min-width:0}

/* 습관 트래커 그리드 */
.hgrid{display:grid; grid-template-columns:1fr repeat(7,30px); gap:4px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
.hgrid:last-of-type{border-bottom:none}
.hcell{width:26px; height:26px; border-radius:7px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; padding:0; margin:0 auto}
.hcell.done{background:var(--accent)}
.hcell.off{opacity:.35}
button.hcell{cursor:pointer; background:var(--soft); border-color:transparent}
button.hcell.done{background:var(--accent); border-color:var(--accent)}
button.hcell.today{outline:1.5px solid var(--ink); outline-offset:0; background:var(--soft)}
button.hcell.today.done{background:var(--accent)}

/* 달력 */
.calhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.calhead .row{gap:5px}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.calwd{text-align:center; font-size:11px; color:var(--sub); padding:2px 0}
.cal-cell{min-height:44px; border-radius:9px; background:var(--panel); padding:5px 0 3px; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer}
.cal-cell.blank{background:transparent; border-color:transparent; cursor:default}
.cal-cell.today{outline:1.5px solid var(--ink); border-color:var(--ink)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-cell.ok{background:#eef4f0; border-color:#dcebe3}
.cal-cell.miss{background:#f9eeee; border-color:#f0dcdc}
.cal-cell.frozen{background:#eef1f6; border-color:#dfe4ee}
.cdots{display:flex; gap:2px; height:5px}
.cd{width:5px; height:5px; border-radius:50%; background:#c4c4cc}
.cd.r{background:var(--red)}
.cd.dl{background:var(--gold)}
.cd.dld{background:var(--green)}
.cal-lg{display:inline-block; width:10px; height:10px; border-radius:3px; margin:0 3px 0 6px; vertical-align:-1px}
.cal-lg.ok{background:#eef4f0} .cal-lg.miss{background:#f9eeee} .cal-lg.frozen{background:#eef1f6}
</style>
</head>
<body>
<div id="app">
  <div id="hero"></div>
  <div id="view"></div>
</div>
<nav><div>
  <button data-tab="today"><span class="ic">🏠</span>오늘</button>
  <button data-tab="cal"><span class="ic">🗓</span>달력</button>
  <button data-tab="plans"><span class="ic">📋</span>계획</button>
  <button data-tab="shop"><span class="ic">🎁</span>보상</button>
  <button data-tab="more"><span class="ic">☰</span>더보기</button>
</div></nav>
<div class="toast" id="toast"></div>

<!-- 로드 순서 중요: core → services → app → components → boot -->
<script>
/* ===== core/utils.js ===== */
/* 공통 유틸 + 이벤트 버스 + 토스트 */
(function (PR) {
  'use strict';

  PR.DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  PR.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  };

  PR.todayStr = function (d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* 해당 날짜가 속한 주의 월요일 (주간 쿼터 기준) */
  PR.weekKey = function (dateStr) {
    var d = new Date((dateStr || PR.todayStr()) + 'T12:00:00');
    var wd = (d.getDay() + 6) % 7; // 월=0
    d.setDate(d.getDate() - wd);
    return PR.todayStr(d);
  };

  /* a → b 일수 차 (b가 미래면 양수) */
  PR.daysBetween = function (a, b) {
    return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  };

  PR.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* 이벤트 버스: 컴포넌트 간 결합도를 낮추는 pub/sub */
  var subs = {};
  PR.bus = {
    on: function (ev, fn) { (subs[ev] = subs[ev] || []).push(fn); },
    emit: function (ev, data) { (subs[ev] || []).forEach(function (fn) { fn(data); }); }
  };

  var toastTimer = null;
  PR.toast = function (html) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.innerHTML = html;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  };
})(window.PR = window.PR || {});

/* ===== core/store.js ===== */
/* 상태 저장소: localStorage 영속화. 모든 상태 변경은 actions를 통해서만.

   데이터 모델 v6
   plan = { id, title, kind:'habit'|'routine'|'deadline', basePts, duty,
            targetT(분|null), targetQ(수|null), unitQ, mode:'or'|'and',   // routine/deadline
            time:'HH:MM'|'',                                             // routine
            freq:{type:'days',days:[]}|{type:'weekly',n},                // habit/routine
            startDate:'YYYY-MM-DD'|'', endDate:'YYYY-MM-DD'|'',          // habit/routine 반복 기간
            deadline:'YYYY-MM-DD', createdAt,                            // deadline
            done, active }
   - startDate/endDate(반복 기간): 범위 밖 날짜에는 아예 예정되지 않음 (생성 전 과거일에
     계획이 소급 표시되어 스트릭·달성률이 왜곡되던 문제 방지).
     비우면 무제한 — startDate '' = 언제부터든, endDate '' = 종료 없음.
   - habit(습관): 정해진 시각 없이 주기적으로 하면 좋은 것. 단순 O/X.
   - routine(반복적인 일): 목표(T/Q)·정시가 있는 반복 작업. 알바/출근 등 의무 포함.
   - duty(의무): 낮은 P 권장, 전체 스트릭 카운트에서 제외.
   log  = { id, planId, date, pts, r, full, duty, onTime, surprise, ts }  // 마일스톤 planId='ms:...', 페널티 planId='penalty'
   project = { id, title, bonusPts, deadline, createdAt, done, doneDate,
               milestones:[{id,title,pts,done,date}] }
   reward   = { id, name, cost, once }            // once=true면 딱 한 번만 살 수 있는 보상
   purchase = { id, rewardId, name, cost, date, used, usedAt }   // 구매 = 사용권(티켓) 1장
   - 구매하면 티켓이 발급되고, 실제로 누릴 때 '사용'을 눌러 소진한다. 다회성 보상은
     티켓이 여러 장 쌓이고, 1회성은 티켓이 남아 있는 동안 상점에서 '구매함'으로 잠긴다
     (소진 여부는 플래그가 아니라 티켓 유무에서 파생 — 상태 불일치가 생길 여지를 없앰).
   v4 심리 보강 필드: freezes(방어막), freezeMark(방어막 지급 눈금), frozenDates(방어막 보호일),
                     lastReconcile(마지막 정산일), penaltyOn(놓친 날 차감 여부) */
(function (PR) {
  'use strict';

  var LS_KEY = 'planning_reward_v1'; // 키는 유지 (내용의 v 필드로 버전 관리)
  var VER = 6;

  function blank() {
    return { v: VER, points: 0, earned: 0, plans: [], logs: [], projects: [], rewards: [], purchases: [], bestStreak: 0, lastMod: 0,
      /* v4: 심리 보강 */
      freezes: 1,            // 보유 방어막 수 (스트릭 보호)
      freezeMark: 0,         // 방어막을 지급한 최고 스트릭 눈금 (7일마다 +1)
      frozenDates: [],       // 방어막으로 보호된 날짜 (스트릭 유지에 성공으로 인정)
      lastReconcile: '',     // 마지막 일일 정산 날짜 (놓친 날 처리 기준)
      penaltyOn: true };     // 목표 놓친 날 소액 차감 여부
  }

  /* v1 → v2: 기본P = (수동P 또는 자동P) × 난이도 배율을 흡수 */
  function migrateV1(d) {
    d.plans = (d.plans || []).map(function (p) {
      var auto = p.type === 'timer' ? p.target : p.type === 'count' ? p.target : 20;
      var base = (p.pts != null && p.pts !== '') ? Number(p.pts) : auto;
      base = Math.round(base * ([1, 1, 1.5, 2][p.diff] || 1));
      return {
        id: p.id, title: p.title, kind: 'habit', basePts: base,
        targetT: p.type === 'timer' ? p.target : null,
        targetQ: p.type === 'count' ? p.target : null,
        unitQ: p.unit || '', mode: 'or', time: p.time || '',
        freq: { type: 'days', days: p.days || [] },
        deadline: '', createdAt: '', done: false, active: p.active !== false
      };
    });
    d.logs = (d.logs || []).map(function (l) { return Object.assign({ r: 1, full: true }, l); });
    d.projects = [];
    d.v = 2;
    return d;
  }

  /* v2 → v3: 기존 habit(목표·정시 가능)은 routine으로, duty 필드 추가 */
  function migrateV2(d) {
    d.plans = (d.plans || []).map(function (p) {
      return Object.assign({ duty: false }, p, { kind: p.kind === 'habit' ? 'routine' : p.kind });
    });
    d.logs = (d.logs || []).map(function (l) { return Object.assign({ duty: false }, l); });
    d.v = 3;
    return d;
  }

  /* v3 → v4: 방어막/정산 필드 추가. lastReconcile을 오늘로 두어 과거 소급 페널티 방지 */
  function migrateV3(d) {
    d.freezes = 1;
    d.freezeMark = 0;
    d.frozenDates = [];
    d.lastReconcile = PR.todayStr();
    d.penaltyOn = true;
    d.v = 4;
    return d;
  }

  /* v4 → v5: 반복 계획에 반복 기간(startDate/endDate) 추가.
     기존 계획의 시작일은 "생성일과 최초 기록일 중 이른 쪽" — 생성일만 쓰면
     그보다 앞선 과거 기록이 달력에서 사라지므로 둘을 함께 본다. 둘 다 없으면
     무제한('')으로 두어 기존 동작을 그대로 유지. */
  function migrateV4(d) {
    var firstLog = {};
    (d.logs || []).forEach(function (l) {
      if (!l.planId || !l.date) return;
      if (!firstLog[l.planId] || l.date < firstLog[l.planId]) firstLog[l.planId] = l.date;
    });
    d.plans = (d.plans || []).map(function (p) {
      if (p.kind !== 'habit' && p.kind !== 'routine') {
        return Object.assign({ startDate: '', endDate: '' }, p);
      }
      var cands = [p.createdAt, firstLog[p.id]].filter(Boolean);
      var start = cands.length ? cands.sort()[0] : '';
      return Object.assign({}, p, { startDate: p.startDate || start, endDate: p.endDate || '' });
    });
    d.v = 5;
    return d;
  }

  /* v5 → v6: 보상 1회성/다회성 + 구매를 사용권(티켓)으로.
     기존 보상은 전부 다회성(=지금까지의 동작 그대로), 기존 구매 내역은 이미 누린 것으로
     보고 사용 완료 처리한다 (안 그러면 예전 구매가 전부 미사용 티켓으로 되살아남). */
  function migrateV5(d) {
    d.rewards = (d.rewards || []).map(function (r) {
      return Object.assign({ once: false }, r);
    });
    var byName = {};
    d.rewards.forEach(function (r) { byName[r.name] = r.id; });
    d.purchases = (d.purchases || []).map(function (p) {
      return Object.assign({ rewardId: byName[p.name] || '', used: true, usedAt: p.date || '' }, p);
    });
    d.v = 6;
    return d;
  }

  function normalize(d) {
    if (!d || !d.v) return blank();
    if (d.v === 1) d = migrateV1(d);
    if (d.v === 2) d = migrateV2(d);
    if (d.v === 3) d = migrateV3(d);
    if (d.v === 4) d = migrateV4(d);
    if (d.v === 5) d = migrateV5(d);
    if (d.v !== VER) return blank();
    return Object.assign(blank(), d);
  }

  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) {}
    return blank();
  }

  PR.store = {
    LS_KEY: LS_KEY,
    blank: blank,
    normalize: normalize,
    state: load(),

    /* 변경 저장 + 파일 동기화 트리거('saved' 이벤트) */
    save: function () {
      this.state.lastMod = Date.now();
      localStorage.setItem(LS_KEY, JSON.stringify(this.state));
      PR.bus.emit('saved');
    },

    /* 전체 교체 (가져오기/초기화) — 구버전 데이터도 자동 변환 */
    replace: function (next) {
      this.state = normalize(next);
      this.save();
    },

    /* 파일 복원용: lastMod를 갱신하지 않고 조용히 교체 */
    setRaw: function (next) {
      this.state = normalize(next);
      localStorage.setItem(LS_KEY, JSON.stringify(this.state));
    }
  };
})(window.PR = window.PR || {});

/* ===== services/points.js ===== */
/* 포인트/스트릭 계산 — 순수 로직 (DOM 의존 없음)

   수식 (1P ≈ 100원 노고 가치, 기본P는 사용자가 직접 설정)
   r  = 달성률: 목표 없으면 1, T만/Q만 있으면 해당 비율,
        둘 다 있으면 OR=max / AND=min
   지급       = 기본P × eff × (1 + 스트릭보너스 if 완전달성)
                eff = 완전달성 1 / 부분 max(r^1.5, 최소 0.1)  ← 부분 완화 + 착수 최저보상

/* ===== services/reconcile.js ===== */
/* 일일 정산 — 앱 로드 시 1회. 지난 "놓친 예정일"을 처리한다.
   놓친 날(예정 있었는데 완전 달성 없음, 방어막 미보호):
     - 방어막이 있으면 자동 소모 → 그 날을 frozenDates에 넣어 스트릭 보호 (페널티 없음)
     - 없고 penaltyOn이면 소액 차감 (총액 상한)
   과거 소급 방지: lastReconcile 이후 ~ 어제까지만. 오늘은 아직 안 끝났으니 건드리지 않음.
   포인트는 0 밑으로 내려가지 않음. 처리 요약은 반환(로드 후 토스트). */
(function (PR) {
  'use strict';

  var PENALTY_RATE = 0.2;   // 놓친 계획 기본P의 20%
  var PENALTY_CAP = 30;     // 1회 정산 총 차감 상한

  function run() {
    var S = PR.store.state;
    var today = PR.todayStr();
    if (S.lastReconcile === today) return null;
    if (!S.lastReconcile) { S.lastReconcile = today; PR.store.save(); return null; } // 첫 실행: 기준일만 설정

    var frozen = {};
    (S.frozenDates || []).forEach(function (d) { frozen[d] = 1; });

    /* lastReconcile 다음날 ~ 어제까지의 놓친 예정일 수집 */
    var missed = [];
    var d = new Date(S.lastReconcile + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    var guard = 0;
    while (PR.todayStr(d) < today && guard++ < 400) {
      var ds = PR.todayStr(d);
      if (!frozen[ds] && !PR.points.metOn(ds) && PR.points.obligationOn(ds)) {
        /* 그 날 예정됐던 비의무 계획들의 기본P 평균 */
        var due = S.plans.filter(function (p) {
          return !p.duty && (p.kind === 'habit' || p.kind === 'routine') &&
            (!p.freq || p.freq.type !== 'weekly') && PR.sched.isScheduledOn(p, ds);
        });
        var avg = due.reduce(function (a, p) { return a + (p.basePts || 0); }, 0) / (due.length || 1);
        missed.push({ ds: ds, pen: Math.max(1, Math.round(avg * PENALTY_RATE)) });
      }
      d.setDate(d.getDate() + 1);
    }

    var saved = 0, penDays = 0, penalty = 0;
    missed.forEach(function (m) {
      if (S.freezes > 0) {                 // 방어막으로 보호
        S.freezes--;
        S.frozenDates.push(m.ds);
        saved++;
      } else if (S.penaltyOn) {            // 소액 차감
        penalty += m.pen;
        penDays++;
      }
    });

    if (penalty > 0) {
      penalty = Math.min(penalty, PENALTY_CAP);
      S.points = Math.max(0, S.points - penalty);
      S.logs.push({ id: PR.uid(), planId: 'penalty', date: today, pts: -penalty,
        r: 0, full: false, duty: true, onTime: false, penalty: true, ts: Date.now() });
    }

    S.lastReconcile = today;
    PR.store.save();

    if (!saved && !penalty) return null;
    var parts = [];
    if (saved) parts.push('🛡 방어막 ' + saved + '개로 스트릭 지킴');
    if (penalty) parts.push('🥶 놓친 날 ' + penDays + '일 · -' + penalty + 'P');
    return parts.join('<br>');
  }

  PR.reconcile = { run: run };
})(window.PR = window.PR || {});

/* ===== services/sync.js ===== */
/* 데이터 동기화: JSON 내보내기/가져오기 + File System Access(PC 자동 저장) */
(function (PR) {
  'use strict';

  var fileHandle = null;
  var writeTimer = null;

  /* --- IndexedDB (파일 핸들 영속화) --- */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('pr-db', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbSet(k, v) {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, k);
        t.oncomplete = res;
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function idbGet(k) {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('kv', 'readonly');
        var q = t.objectStore('kv').get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }

  var sync = {
    supported: function () { return 'showSaveFilePicker' in window; },
    hasHandle: function () { return !!fileHandle; },

    exportData: function () {
      var blob = new Blob([JSON.stringify(PR.store.state, null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'planning_reward_data.json';
      a.click();
      URL.revokeObjectURL(a.href);
      PR.toast('내보내기 완료 — Syncthing 폴더에 넣으면 다른 기기로 전송돼요');
    },

    importFile: function (file) {
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d.v || d.v < 1 || d.v > 3) throw 0;
          if (d.lastMod < PR.store.state.lastMod &&
              !confirm('가져오는 데이터가 현재 데이터보다 오래됐어요. 그래도 덮어쓸까요?')) return;
          PR.actions.importState(d);
        } catch (e) {
          PR.toast('올바른 데이터 파일이 아니에요');
        }
      };
      rd.readAsText(file);
    },

    linkFile: function () {
      return window.showSaveFilePicker({
        suggestedName: 'planning_reward_data.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      }).then(function (h) {
        fileHandle = h;
        return idbSet('fh', h);
      }).then(function () {
        sync.write();
        PR.toast('파일 연결 완료 — 이제 자동 저장돼요');
        PR.bus.emit('change');
      }).catch(function () { /* 사용자 취소 */ });
    },

    /* 디바운스된 파일 쓰기 (store 저장 시 자동 호출) */
    write: function () {
      if (!fileHandle) return;
      clearTimeout(writeTimer);
      writeTimer = setTimeout(function () {
        fileHandle.createWritable().then(function (w) {
          return w.write(JSON.stringify(PR.store.state, null, 1)).then(function () { return w.close(); });
        }).catch(function () { fileHandle = null; });
      }, 400);
    },

    /* 시작 시: 연결된 파일이 더 최신이면 그 데이터로 복원 */
    restoreFile: function () {
      if (!sync.supported()) return Promise.resolve();
      return idbGet('fh').then(function (h) {
        if (!h) return;
        return h.queryPermission({ mode: 'readwrite' }).then(function (perm) {
          if (perm !== 'granted') return; // 재허용은 사용자가 '파일 연결' 버튼으로
          fileHandle = h;
          return h.getFile().then(function (f) { return f.text(); }).then(function (txt) {
            var d = JSON.parse(txt);
            if (d.v >= 1 && d.v <= 3 && d.lastMod > PR.store.state.lastMod) {
              PR.store.setRaw(d);
              PR.bus.emit('change');
            }
          });
        });
      }).catch(function () {});
    }
  };

  PR.bus.on('saved', function () { sync.write(); });
  PR.sync = sync;
})(window.PR = window.PR || {});

/* 앱 셸: 탭 라우팅 + 렌더 오케스트레이션.
   컴포넌트 계약: { render(): string, bind?(rootEl), onNavAway?() }
   PR.app.register(name, component)로 등록 */
(function (PR) {
  'use strict';

    if (p.time) {

      var within = PR.points.inWindow(p, n.getHours() * 60 + n.getMinutes());
      if (!within) { // 지금이 시간대 안이면 물어볼 필요 없이 자동 인정 (체크박스 생략)
        h += '<label style="display:flex; align-items:center; gap:6px; cursor:pointer; flex-basis:100%; margin:0 0 2px">' +
          '<input type="checkbox" id="' + idPrefix + '-tm" style="width:auto">' +
          '시간대(' + p.time + (p.timeTo ? '~' + p.timeTo : ' ±30분') + ') 안에 완료했었어요 (+30%)</label>';
      }
    }
    if (p.targetT) h += '<div class="grow"><label>실제 시간 (분)</label><input type="number" min="0" id="' + idPrefix + '-t" value="' + p.targetT + '"></div>';
    if (p.targetQ) h += '<div class="grow"><label>실제 분량 (' + PR.esc(p.unitQ || '개') + ')</label><input type="number" min="0" id="' + idPrefix + '-q" value="' + p.targetQ + '"></div>';
    h += '<button data-confirm="' + p.id + '" style="align-self:flex-end">지급</button>';
    if (p.kind === 'deadline') {
      h += '<div class="sub" style="flex-basis:100%">뒤늦게 기록하는 경우 실제 완료일을 고르세요 — 마감 내였다면 지각 감액이 없어요 (소급 기록은 보너스 제외)</div>';
    }
    h += '</div>';
    return h;
  }

  PR.vh = { planChips: planChips, rangeFields: rangeFields, readRange: readRange,
            progressBar: progressBar, completeForm: completeForm };
})(window.PR = window.PR || {});

/* ===== components/hero.js ===== */
/* 상단 히어로: 포인트 잔액 / 스트릭 / 방어막 (레벨 시스템 제거됨) */
(function (PR) {
  'use strict';

  PR.app.register('hero', {
    render: function () {
      var S = PR.store.state;
      var st = PR.points.computeStreak(false);
      var today = PR.todayStr();
      var todayPts = S.logs.filter(function (l) { return l.date === today; })
        .reduce(function (a, l) { return a + l.pts; }, 0);
      var tickets = S.purchases.filter(function (p) { return !p.used; }).length; // 안 쓴 사용권
      return '' +
        '<div class="hero">' +
          '<div class="row"><div class="grow">' +
            '<div class="big">' + S.points.toLocaleString() + ' P</div>' +

          '</div><div style="font-size:34px">' + (st >= 7 ? '🔥' : st >= 3 ? '✨' : '🌱') + '</div></div>' +
          '<div class="badges">' +
            '<span class="badge">🔥 스트릭 ' + st + '일</span>' +
            '<span class="badge">🏆 최고 ' + S.bestStreak + '일</span>' +
            '<span class="badge">🛡 방어막 ' + (S.freezes || 0) + '</span>' +
            (tickets ? '<span class="badge">🎟 사용권 ' + tickets + '</span>' : '') +
          '</div>' +
        '</div>';
    }
  });
})(window.PR = window.PR || {});

/* ===== components/habits.js ===== */
/* 습관 탭: 해빗트래커 그리드 (최근 7일) + 습관 관리
   습관 = 정해진 시각 없이 주기적으로 하면 좋은 것. 단순 O/X 체크. */
(function (PR) {
  'use strict';

  var editing = null;

  function habits() {
    return PR.store.state.plans.filter(function (p) { return p.kind === 'habit' && p.active; });
  }

  function last7() {
    var out = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      out.push(PR.todayStr(d));
    }
    return out;
  }

  function gridHtml() {
    /* 반복 기간이 끝난 습관은 그리드에서 제외 (아래 '습관 관리'에는 그대로 보임) */
    var hs = habits().filter(function (p) { return !PR.sched.isExpired(p); });
    if (!hs.length) return '<div class="card"><div class="empty">습관을 추가해 보세요!<br>물 마시기, 스트레칭, 일기 쓰기 같은 것들 🌱</div></div>';
    var days = last7();
    var today = PR.todayStr();
    var logsBy = {};
    PR.store.state.logs.forEach(function (l) { logsBy[l.planId + '|' + l.date] = l.full; });

    var head = '<div class="hgrid" style="margin-bottom:2px"><div></div>' + days.map(function (ds) {
      var d = new Date(ds + 'T12:00:00');
      return '<div class="sub" style="text-align:center">' + PR.DAYS[d.getDay()] + '<br>' + d.getDate() + '</div>';
    }).join('') + '</div>';

    var rows = hs.map(function (p) {
      var st = PR.sched.planStreak(p);
      var quota = '';
      if (p.freq && p.freq.type === 'weekly') {
        var k = PR.sched.weekFullCount(p.id);
        quota = ' · 이번 주 ' + Math.min(k, p.freq.n) + '/' + p.freq.n + (k >= p.freq.n ? ' ✓' : '');
      }
      var cells = days.map(function (ds) {
        var done = !!logsBy[p.id + '|' + ds];
        var sched = PR.sched.isScheduledOn(p, ds);
        if (ds === today) {
          return '<button class="hcell today ' + (done ? 'done' : '') + '" data-hb="' + p.id + '" data-hbd="' + ds + '">' + (done ? '✓' : '') + '</button>';
        }
        if (sched) { // 지난 날도 체크/해제 가능 (소급: 보너스 없이 지급, 스트릭 날짜는 인정)
          return '<button class="hcell ' + (done ? 'done' : '') + '" data-hb="' + p.id + '" data-hbd="' + ds + '">' + (done ? '✓' : '') + '</button>';
        }
        return '<div class="hcell off">' + (done ? '✓' : '') + '</div>';
      }).join('');
      return '<div class="hgrid"><div style="min-width:0">' +
        '<div class="t" style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">' + PR.esc(p.title) + '</div>' +
        '<div class="sub">🔥' + st.n + st.unit + ' · +' + p.basePts + 'P' + quota + '</div>' +
      '</div>' + cells + '</div>';
    }).join('');

    return '<div class="card">' + head + rows +
      '<div class="sub" style="margin-top:8px">칸을 눌러 체크/해제 — 지난 날도 가능 (소급은 보너스 없이 지급) · 흐린 칸은 예정일 아님</div></div>';
  }

  function formHtml() {
    var p = editing || { title: '', basePts: 10, freq: { type: 'days', days: [] }, startDate: PR.todayStr(), endDate: '' };
    var f = p.freq || { type: 'days', days: [] };
    var dayBtns = PR.DAYS.map(function (d, i) {
      return '<button type="button" class="' + ((f.days || []).indexOf(i) !== -1 ? 'on' : '') + '" data-day="' + i + '">' + d + '</button>';
    }).join('');
    return '<div class="card">' +
      '<div style="font-weight:700; margin-bottom:2px">' + (editing ? '✏️ 습관 수정' : '➕ 새 습관') + '</div>' +
      '<div class="row">' +
        '<div class="grow" style="flex:2"><label>습관 이름</label>' +
          '<input id="h-title" placeholder="예: 물 2L, 스트레칭" value="' + PR.esc(p.title) + '"></div>' +
        '<div class="grow"><label>포인트</label>' +
          '<input id="h-base" type="number" min="1" value="' + (p.basePts || '') + '"></div>' +
      '</div>' +
      '<div class="sub" style="margin-top:4px">습관은 가볍게 5~20P 권장</div>' +
      '<label>반복 방식</label>' +
      '<div class="row">' +
        '<button type="button" class="grow ' + (f.type !== 'weekly' ? '' : 'gray') + '" id="h-ftype-days">요일 고정</button>' +
        '<button type="button" class="grow ' + (f.type === 'weekly' ? '' : 'gray') + '" id="h-ftype-weekly">주 n회</button>' +
      '</div>' +
      '<div id="h-days-wrap" class="' + (f.type === 'weekly' ? 'hidden' : '') + '">' +
        '<label>요일 (선택 안 하면 매일)</label>' +
        '<div class="daybtns" id="h-days">' + dayBtns + '</div>' +
      '</div>' +
      '<div id="h-weekly-wrap" class="' + (f.type === 'weekly' ? '' : 'hidden') + '">' +
        '<label>주당 횟수</label>' +
        '<input id="h-wn" type="number" min="1" max="7" value="' + (f.n || 3) + '">' +
      '</div>' +
      PR.vh.rangeFields(p, 'h') +
      '<div class="row" style="margin-top:12px">' +
        '<button id="h-save" class="grow">' + (editing ? '수정 저장' : '습관 추가') + '</button>' +
        (editing ? '<button id="h-cancel" class="gray">취소</button>' : '') +
      '</div>' +
    '</div>';
  }

  function listHtml() {
    var hs = habits();
    if (!hs.length) return '';
    return '<div class="card"><details><summary>습관 관리 (' + hs.length + ')</summary>' +
      hs.map(function (p) {
        var f = p.freq || { type: 'days', days: [] };
        var dd = f.type === 'weekly' ? '주 ' + f.n + '회'
          : (f.days && f.days.length) ? f.days.map(function (d) { return PR.DAYS[d]; }).join('') : '매일';
        var period = PR.sched.isExpired(p) ? ' · <span style="color:var(--sub)">기간 종료(' + p.endDate + ')</span>'
          : (p.endDate ? ' · ~' + p.endDate : '');
        return '<div class="plan"><div class="grow"><div class="t">' + PR.esc(p.title) + '</div>' +
          '<div class="sub">' + dd + ' · +' + p.basePts + 'P' + period + '</div></div>' +
          '<button class="ghost small" data-hedit="' + p.id + '">수정</button>' +
          '<button class="danger small" data-hdel="' + p.id + '">삭제</button></div>';
      }).join('') + '</details></div>';
  }

  function submit() {
    var title = document.getElementById('h-title').value.trim();
    var base = Number(document.getElementById('h-base').value);
    if (!title) { PR.toast('습관 이름을 입력해 주세요'); return; }
    if (!base || base < 1) { PR.toast('포인트를 입력해 주세요'); return; }
    var range = PR.vh.readRange('h');
    if (!range) return;
    var weekly = !document.getElementById('h-weekly-wrap').classList.contains('hidden');
    var p = {
      id: editing ? editing.id : PR.uid(),
      title: title, kind: 'habit', basePts: base, duty: false,
      targetT: null, targetQ: null, unitQ: '', mode: 'or', time: '',
      freq: weekly
        ? { type: 'weekly', n: Math.min(7, Math.max(1, Number(document.getElementById('h-wn').value) || 3)) }
        : { type: 'days', days: Array.prototype.map.call(document.querySelectorAll('#h-days button.on'), function (b) { return Number(b.dataset.day); }) },
      startDate: range.startDate, endDate: range.endDate,
      deadline: '', createdAt: editing ? editing.createdAt : PR.todayStr(),
      done: false, active: true
    };
    var isEdit = !!editing;
    editing = null;
    PR.actions.savePlan(p, isEdit);
  }

  PR.app.register('habit', {
    render: function () {
      return '<h2>습관 트래커</h2>' + gridHtml() + formHtml() + listHtml();
    },

    bind: function (root) {
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.hb) { // 날짜 칸 토글 (오늘 + 지난 7일)
          var ds = b.dataset.hbd || PR.todayStr();
          var has = PR.store.state.logs.some(function (l) { return l.planId === b.dataset.hb && l.date === ds; });
          if (has) PR.actions.uncompletePlan(b.dataset.hb, ds);
          else PR.actions.completePlan(b.dataset.hb, { date: ds });
          return;
        }
        if (b.dataset.day !== undefined && b.dataset.day !== '') { b.classList.toggle('on'); return; }
        if (b.id === 'h-ftype-days' || b.id === 'h-ftype-weekly') {
          var weekly = b.id === 'h-ftype-weekly';
          document.getElementById('h-days-wrap').classList.toggle('hidden', weekly);
          document.getElementById('h-weekly-wrap').classList.toggle('hidden', !weekly);
          document.getElementById('h-ftype-days').className = 'grow ' + (weekly ? 'gray' : '');
          document.getElementById('h-ftype-weekly').className = 'grow ' + (weekly ? '' : 'gray');
          return;
        }
        if (b.id === 'h-save') submit();
        if (b.id === 'h-cancel') { editing = null; PR.app.render(); }
        if (b.dataset.hedit) {
          editing = JSON.parse(JSON.stringify(PR.store.state.plans.find(function (p) { return p.id === b.dataset.hedit; })));
          PR.app.render();
        }
        if (b.dataset.hdel && confirm('이 습관을 삭제할까요? (기록은 유지됩니다)')) PR.actions.deletePlan(b.dataset.hdel);
      };
    },

    onNavAway: function () { editing = null; }
  });
})(window.PR = window.PR || {});

/* ===== components/today.js ===== */
/* 오늘 탭: 습관 + 1회성(마감) + 반복적인 일 + 프로젝트 다음 단계 */
(function (PR) {
  'use strict';

  var openId = null; // 완료 입력 폼이 열린 계획 id

  function expectFull(p) { // 완전 달성 시 예상 포인트 (미리보기)
    return PR.points.calcAward(p, { t: p.targetT || 0, q: p.targetQ || 0 }).total;
  }

  function planRow(p) {
    var done = !!PR.sched.todayLog(p.id);
    var n0 = new Date();
    var outOfWindow = p.time && !PR.points.inWindow(p, n0.getHours() * 60 + n0.getMinutes());
    /* 폼이 필요한 경우: 실제 수행량 입력(목표), 완료일 입력(마감형),
       시간대 밖 완료(정시 여부 확인). 시간대 안이면 자동 인정이라 물어보지 않음 */
    var needForm = p.targetT || p.targetQ || p.kind === 'deadline' || outOfWindow;
    var quota = '';
    if (p.kind === 'routine' && p.freq && p.freq.type === 'weekly') {
      var k = PR.sched.weekFullCount(p.id);
      quota = '<span class="chip ' + (k >= p.freq.n ? 'd1' : '') + '">이번 주 ' + Math.min(k, p.freq.n) + '/' + p.freq.n + (k >= p.freq.n ? ' ✓' : '') + '</span>';
    }
    var hint = '';
    if (!done && p.kind === 'deadline') {
      var ds = PR.points.deadlineState(p);
      hint = '<div class="sub" style="margin-top:2px">' + (ds.late
        ? '<span style="color:var(--red)">마감 지남 · 지급 50%</span>'
        : '지금 끝내면 조기 보너스 +' + Math.round(p.basePts * 0.3 * ds.earlyRatio) + 'P') + '</div>';
    }
    var h = '<div class="plan ' + (done ? 'done' : '') + '">' +
      '<div class="grow">' +
        '<div class="t">' + PR.esc(p.title) + '</div>' +
        '<div style="margin-top:4px">' + PR.vh.planChips(p) + quota + '</div>' +
        (done ? '' : '<div class="sub" style="margin-top:4px">완전 달성 시 <span class="pts">+' + expectFull(p) + 'P</span>' +
          (p.time ? ' · ⏰정시 +' + Math.round(p.basePts * 0.3) + 'P' : '') + '</div>') + hint +
      '</div>' +
      (done
        ? '<button class="gray small" data-undo="' + p.id + '">취소</button>'
        : (needForm
            ? '<button class="' + (openId === p.id ? 'gray' : '') + '" data-open="' + p.id + '">' + (openId === p.id ? '닫기' : '완료') + '</button>'
            : '<button data-donex="' + p.id + '">완료</button>')) +
    '</div>';
    if (!done && needForm && openId === p.id) h += PR.vh.completeForm(p, 'c' + p.id);
    return h;
  }

  PR.app.register('today', {
    render: function () {
      var S = PR.store.state;
      var today = PR.todayStr();
      var now = new Date();
      var out = '<h2>' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + PR.DAYS[now.getDay()] + ') 오늘</h2>';

      /* 1. 오늘의 습관 (단순 토글) */
      var habits = S.plans.filter(function (p) { return p.kind === 'habit' && PR.sched.isScheduledOn(p, today); });
      if (habits.length) {
        var hDone = habits.filter(function (p) { return PR.sched.todayLog(p.id); }).length;
        out += '<div class="card"><div class="sub" style="margin-bottom:4px">🌱 습관 · ' + hDone + '/' + habits.length + '</div>' +
          habits.map(function (p) {
            var done = !!PR.sched.todayLog(p.id);
            var st = PR.sched.planStreak(p);
            return '<div class="plan ' + (done ? 'done' : '') + '">' +
              '<div class="grow"><div class="t">' + PR.esc(p.title) + '</div>' +
              '<div class="sub">🔥' + st.n + st.unit + ' · +' + p.basePts + 'P</div></div>' +
              '<button class="' + (done ? 'gray ' : '') + 'small" data-hb="' + p.id + '">' + (done ? '✓ 완료' : '체크') + '</button>' +
            '</div>';
          }).join('') + '</div>';
      }

      /* 2. 1회성 (마감) — 반복보다 우선 노출 */
      var dls = PR.sched.pendingDeadlines();
      if (dls.length) {
        out += '<div class="card"><div class="sub" style="margin-bottom:4px">📅 1회성 (마감)</div>' +
          dls.map(planRow).join('') + '</div>';
      }

      /* 3. 반복적인 일 */
      var routines = S.plans.filter(function (p) { return p.kind === 'routine' && PR.sched.isScheduledOn(p, today); });
      if (routines.length) {
        var doneN = routines.filter(function (p) { return PR.sched.todayLog(p.id); }).length;
        out += '<div class="card"><div class="sub" style="margin-bottom:4px">🔁 반복적인 일 · 달성 ' + doneN + '/' + routines.length + '</div>' +
          routines.map(planRow).join('') + '</div>';
      }

      /* 4. 프로젝트 다음 단계 */
      var pjs = S.projects.filter(function (x) { return !x.done; });
      if (pjs.length) {
        out += '<div class="card"><div class="sub" style="margin-bottom:4px">🚩 프로젝트 — 다음 단계</div>' +
          pjs.map(function (pj) {
            var doneN = pj.milestones.filter(function (m) { return m.done; }).length;
            var next = pj.milestones.find(function (m) { return !m.done; });
            return '<div class="plan"><div class="grow">' +
              '<div class="t">' + PR.esc(pj.title) + '</div>' +
              PR.vh.progressBar(doneN, pj.milestones.length) +
              (next ? '<div class="sub" style="margin-top:4px">다음: <b>' + PR.esc(next.title) + '</b> <span class="pts">+' + next.pts + 'P</span></div>' : '') +
              (doneN === pj.milestones.length - 1 ? '<div class="sub">마지막 단계! 완주 보너스 +' + PR.points.projectBonus(pj).total + 'P</div>' : '') +
            '</div>' +
            (next ? '<button data-ms="' + pj.id + ':' + next.id + '">완료</button>' : '') +
            '</div>';
          }).join('') + '</div>';
      }

      if (!habits.length && !routines.length && !dls.length && !pjs.length) {
        out += '<div class="card"><div class="empty">오늘 예정된 계획이 없어요.<br>📋 계획 탭에서 추가해 보세요!</div></div>';
      }
      /* 5. 번외 기록: 계획에 없던 일 */
      var ads = S.logs.filter(function (l) { return l.adhoc && l.date === today; });
      out += '<div class="card">' +
        '<div style="font-weight:700">🔖 계획에 없던 일</div>' +
        '<div class="sub" style="margin-top:2px">즉흥적으로 한 일도 기록하고 포인트 받기 — 계획한 일의 80%로 지급, 연속 달성 일수에는 안 들어가요</div>' +
        '<div class="row" style="margin-top:8px">' +
          '<input id="ad-title" style="flex:2" placeholder="무엇을 했나요?">' +
          '<input id="ad-pts" type="number" min="1" placeholder="가치 P" style="width:80px">' +
          '<button id="ad-add">기록</button>' +
        '</div>' +
        (ads.length ? '<div style="margin-top:8px">' + ads.map(function (l) {
          return '<div class="hist"><span>🔖 ' + PR.esc(l.title || '') + ' <span class="pts">+' + l.pts + 'P</span></span>' +
            '<button class="danger small" data-addel="' + l.id + '">✕</button></div>';
        }).join('') + '</div>' : '') +
      '</div>';

      return out;
    },

    bind: function (root) {
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.hb) { // 습관 토글
          if (PR.sched.todayLog(b.dataset.hb)) PR.actions.uncompletePlan(b.dataset.hb);
          else PR.actions.completePlan(b.dataset.hb, {});
          return;
        }
        if (b.dataset.open) { openId = openId === b.dataset.open ? null : b.dataset.open; PR.app.render(); }
        if (b.dataset.donex) { openId = null; PR.actions.completePlan(b.dataset.donex, {}); }
        if (b.dataset.confirm) {
          var id = b.dataset.confirm;
          var tEl = document.getElementById('c' + id + '-t');
          var qEl = document.getElementById('c' + id + '-q');
          var dEl = document.getElementById('c' + id + '-d');
          var tmEl = document.getElementById('c' + id + '-tm');
          openId = null;
          PR.actions.completePlan(id, { t: tEl ? tEl.value : 0, q: qEl ? qEl.value : 0,
            date: dEl ? dEl.value : undefined, ontime: tmEl ? tmEl.checked : undefined });
        }
        if (b.dataset.undo && confirm('완료를 취소할까요? 받은 포인트가 회수됩니다.')) PR.actions.uncompletePlan(b.dataset.undo);
        if (b.id === 'ad-add') {
          var adTitle = document.getElementById('ad-title').value.trim();
          var adWorth = Number(document.getElementById('ad-pts').value);
          if (!adTitle || !adWorth || adWorth < 1) { PR.toast('내용과 가치(P)를 입력해 주세요'); return; }
          PR.actions.addAdhoc(adTitle, adWorth);
        }
        if (b.dataset.addel && confirm('이 기록을 삭제할까요? 받은 포인트가 회수됩니다.')) PR.actions.deleteAdhoc(b.dataset.addel);
        if (b.dataset.ms) {
          var pair = b.dataset.ms.split(':');
          PR.actions.completeMilestone(pair[0], pair[1]);
        }
      };
    },

    onNavAway: function () { openId = null; }
  });
})(window.PR = window.PR || {});

/* ===== components/plans.js ===== */
/* 계획 탭: [1회성 (마감) | 반복] 세그먼트 + 종류별 전용 폼. 프로젝트는 전용 탭으로 분리 */
(function (PR) {
  'use strict';

  var seg = 'deadline';  // 'deadline' | 'routine' | 'habit' | 'proj' — 1회성 목표 우선
  var editing = null;    // 수정 중인 계획

  function switchSeg(next) {
    var v = PR.app.views[seg];
    if (v && v.onNavAway) v.onNavAway();
    editing = null;
    seg = next;
    PR.app.render();
  }

  function targetFields(p) {
    return '<label>목표 (선택 · 비우면 O/X 체크)</label>' +
      '<div class="row">' +
        '<div class="grow"><label style="margin-top:0">⏱ 시간 (분)</label>' +
          '<input id="f-tt" type="number" min="1" value="' + (p.targetT || '') + '" placeholder="예: 60"></div>' +
        '<div class="grow"><label style="margin-top:0">🔢 분량</label>' +
          '<input id="f-tq" type="number" min="1" value="' + (p.targetQ || '') + '" placeholder="예: 50"></div>' +
        '<div class="grow"><label style="margin-top:0">단위</label>' +
          '<input id="f-unit" placeholder="쪽/단어/문제" value="' + PR.esc(p.unitQ || '') + '"></div>' +
      '</div>' +
      '<div id="f-mode-wrap" class="hidden"><label>둘 다 입력됨 — 달성 기준</label>' +
        '<select id="f-mode">' +
          '<option value="or"' + (p.mode !== 'and' ? ' selected' : '') + '>둘 중 하나만 채우면 달성 (OR)</option>' +
          '<option value="and"' + (p.mode === 'and' ? ' selected' : '') + '>둘 다 채워야 달성 (AND)</option>' +
        '</select></div>';
  }

  function timeFields(p) {
    return '<label>수행 시간대 (선택 · 정시 보너스 +30%)</label>' +
      '<div class="row">' +
        '<div class="grow"><input id="f-time" type="time" value="' + (p.time || '') + '"></div>' +
        '<div style="color:var(--sub)">~</div>' +
        '<div class="grow"><input id="f-timeto" type="time" value="' + (p.timeTo || '') + '"></div>' +
      '</div>';
  }

  function commonHead(p, label, ph) {
    return '<div class="row">' +
      '<div class="grow" style="flex:2"><label>' + label + '</label>' +
        '<input id="f-title" placeholder="' + ph + '" value="' + PR.esc(p.title) + '"></div>' +
      '<div class="grow"><label>기본 포인트</label>' +
        '<input id="f-base" type="number" min="1" value="' + (p.basePts || '') + '" placeholder="30"></div>' +
    '</div>' +
    '<label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-top:10px">' +
      '<input type="checkbox" id="f-duty" style="width:auto"' + (p.duty ? ' checked' : '') + '>' +
      '의무 (알바·출근·수업 — 스트릭 제외)</label>';
  }

  /* ---------------- 반복적인 일 폼 ---------------- */
  function routineForm() {
    var p = (editing && editing.kind === 'routine') ? editing
      : { title: '', basePts: 30, duty: false, targetT: '', targetQ: '', unitQ: '', mode: 'or', time: '', timeTo: '',
          freq: { type: 'days', days: [] }, startDate: PR.todayStr(), endDate: '' };
    var f = p.freq || { type: 'days', days: [] };
    var dayBtns = PR.DAYS.map(function (d, i) {
      return '<button type="button" class="' + ((f.days || []).indexOf(i) !== -1 ? 'on' : '') + '" data-day="' + i + '">' + d + '</button>';
    }).join('');
    return '<div class="card">' +
      '<div style="font-weight:700; margin-bottom:2px">' + (editing ? '✏️ 수정' : '➕ 새 반복적인 일') + '</div>' +
      commonHead(p, '이름', '예: 독서, 영어 공부, 알바') +
      targetFields(p) +
      timeFields(p) +
      '<label>반복 방식</label>' +
      '<div class="row">' +
        '<button type="button" class="grow ' + (f.type !== 'weekly' ? '' : 'gray') + '" id="f-ftype-days">요일 고정</button>' +
        '<button type="button" class="grow ' + (f.type === 'weekly' ? '' : 'gray') + '" id="f-ftype-weekly">주 n회</button>' +
      '</div>' +
      '<div id="f-days-wrap" class="' + (f.type === 'weekly' ? 'hidden' : '') + '">' +
        '<label>요일 (선택 안 하면 매일)</label>' +
        '<div class="daybtns" id="f-days">' + dayBtns + '</div>' +
      '</div>' +
      '<div id="f-weekly-wrap" class="' + (f.type === 'weekly' ? '' : 'hidden') + '">' +
        '<label>주당 횟수</label>' +
        '<input id="f-wn" type="number" min="1" max="7" value="' + (f.n || 3) + '">' +
      '</div>' +
      PR.vh.rangeFields(p, 'f') +
      '<div class="row" style="margin-top:12px">' +
        '<button id="f-save-routine" class="grow">' + (editing ? '수정 저장' : '추가') + '</button>' +
        (editing ? '<button id="f-cancel" class="gray">취소</button>' : '') +
      '</div>' +
    '</div>';
  }

  /* ---------------- 1회성 (마감) 폼 ---------------- */
  function deadlineForm() {
    var p = (editing && editing.kind === 'deadline') ? editing
      : { title: '', basePts: 50, duty: false, targetT: '', targetQ: '', unitQ: '', mode: 'or', time: '', timeTo: '', deadline: '' };
    return '<div class="card">' +
      '<div style="font-weight:700; margin-bottom:2px">' + (editing ? '✏️ 수정' : '➕ 새 1회성 목표') + '</div>' +
      commonHead(p, '이름', '예: 보고서 제출, 과제') +
      targetFields(p) +
      timeFields(p) +
      '<label>마감일 (일찍 끝낼수록 보너스 ↑)</label>' +
      '<input id="f-deadline" type="date" value="' + (p.deadline || '') + '">' +
      '<div class="row" style="margin-top:12px">' +
        '<button id="f-save-deadline" class="grow">' + (editing ? '수정 저장' : '추가') + '</button>' +
        (editing ? '<button id="f-cancel" class="gray">취소</button>' : '') +
      '</div>' +
    '</div>';
  }

  function planList(kind) {
    var S = PR.store.state;
    // 완료한 일은 계획탭에서 숨김 (달력탭에서 확인) — 미완료만 표시
    var list = S.plans.filter(function (p) { return p.kind === kind && !p.done; });
    /* 반복 기간이 끝난 계획은 목록 아래로 (칩으로 '기간 종료' 표시됨) */
    list = list.slice().sort(function (a, b) {
      return (PR.sched.isExpired(a) ? 1 : 0) - (PR.sched.isExpired(b) ? 1 : 0);
    });
    var items = list.length ? list.map(function (pl) {
      return '<div class="plan ' + (pl.done ? 'done' : '') + '">' +
        '<div class="grow">' +
          '<div class="t">' + PR.esc(pl.title) + (pl.done ? ' <span class="chip d1">완료됨</span>' : '') + '</div>' +
          '<div style="margin-top:4px">' + PR.vh.planChips(pl) + ' <span class="sub">기본 ' + pl.basePts + 'P</span></div>' +
        '</div>' +
        (pl.done ? '<button class="gray small" data-undone="' + pl.id + '">완료 취소</button>' : '') +
        '<button class="ghost small" data-edit="' + pl.id + '">수정</button>' +
        '<button class="danger small" data-del="' + pl.id + '">삭제</button>' +
      '</div>';
    }).join('') : '<div class="empty">아직 없어요</div>';
    return '<div class="card">' + items + '</div>';
  }

  /* ---------------- 제출 ---------------- */
  function readTargets() {
    return {
      targetT: Number(document.getElementById('f-tt').value) || null,
      targetQ: Number(document.getElementById('f-tq').value) || null,
      unitQ: (document.getElementById('f-unit').value || '').trim(),
      mode: document.getElementById('f-mode').value
    };
  }

  function submitCommon(kind) {
    var title = document.getElementById('f-title').value.trim();
    var base = Number(document.getElementById('f-base').value);
    if (!title) { PR.toast('이름을 입력해 주세요'); return null; }
    if (!base || base < 1) { PR.toast('기본 포인트를 입력해 주세요'); return null; }
    return Object.assign({
      id: editing ? editing.id : PR.uid(),
      title: title, kind: kind, basePts: base,
      duty: document.getElementById('f-duty').checked,
      time: document.getElementById('f-time').value || '',
      timeTo: document.getElementById('f-timeto').value || '',
      freq: { type: 'days', days: [] }, deadline: '', startDate: '', endDate: '',
      createdAt: editing ? (editing.createdAt || PR.todayStr()) : PR.todayStr(),
      done: editing ? !!editing.done : false,
      active: true
    }, readTargets());
  }

  function submitRoutine() {
    var range = PR.vh.readRange('f');
    if (!range) return;
    var p = submitCommon('routine');
    if (!p) return;
    p.startDate = range.startDate;
    p.endDate = range.endDate;
    var weekly = !document.getElementById('f-weekly-wrap').classList.contains('hidden');
    p.freq = weekly
      ? { type: 'weekly', n: Math.min(7, Math.max(1, Number(document.getElementById('f-wn').value) || 3)) }
      : { type: 'days', days: Array.prototype.map.call(document.querySelectorAll('#f-days button.on'), function (b) { return Number(b.dataset.day); }) };
    var isEdit = !!editing;
    editing = null;
    PR.actions.savePlan(p, isEdit);
  }

  function submitDeadline() {
    var p = submitCommon('deadline');
    if (!p) return;
    p.deadline = document.getElementById('f-deadline').value || '';
    if (!p.deadline) { PR.toast('마감일을 입력해 주세요'); return; }
    var isEdit = !!editing;
    editing = null;
    PR.actions.savePlan(p, isEdit);
  }

  /* ---------------- 컴포넌트 ---------------- */
  PR.app.register('plans', {
    render: function () {
      var segBtns = '<div class="row" style="margin-bottom:10px">' +
        '<button class="grow small ' + (seg === 'deadline' ? '' : 'gray') + '" data-seg="deadline">📅 1회성</button>' +
        '<button class="grow small ' + (seg === 'routine' ? '' : 'gray') + '" data-seg="routine">🔁 반복</button>' +
        '<button class="grow small ' + (seg === 'habit' ? '' : 'gray') + '" data-seg="habit">🌱 습관</button>' +
        '<button class="grow small ' + (seg === 'proj' ? '' : 'gray') + '" data-seg="proj">🚩 프로젝트</button></div>';
      var body;
      if (seg === 'habit' || seg === 'proj') {
        body = PR.app.views[seg].render().replace(/^<h2>[^<]*<\/h2>/, '');
      } else if (seg === 'deadline') {
        body = deadlineForm() + planList('deadline');
      } else {
        body = routineForm() + planList('routine');
      }
      return '<h2>계획 관리</h2>' + segBtns + body;
    },

    bind: function (root) {
      if (seg === 'habit' || seg === 'proj') {
        var v = PR.app.views[seg];
        if (v && v.bind) v.bind(root);
        var sub = root.onclick;
        root.onclick = function (e) {
          var sb = e.target.closest('button');
          if (sb && sb.dataset.seg) { switchSeg(sb.dataset.seg); return; }
          if (sub) sub(e);
        };
        return;
      }
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.seg) { switchSeg(b.dataset.seg); return; }
        if (b.dataset.day !== undefined && b.dataset.day !== '') { b.classList.toggle('on'); return; }
        if (b.id === 'f-ftype-days' || b.id === 'f-ftype-weekly') {
          var weekly = b.id === 'f-ftype-weekly';
          document.getElementById('f-days-wrap').classList.toggle('hidden', weekly);
          document.getElementById('f-weekly-wrap').classList.toggle('hidden', !weekly);
          document.getElementById('f-ftype-days').className = 'grow ' + (weekly ? 'gray' : '');
          document.getElementById('f-ftype-weekly').className = 'grow ' + (weekly ? '' : 'gray');
          return;
        }
        if (b.id === 'f-save-routine') submitRoutine();
        if (b.id === 'f-save-deadline') submitDeadline();
        if (b.id === 'f-cancel') { editing = null; PR.app.render(); }
        if (b.dataset.edit) {
          editing = JSON.parse(JSON.stringify(PR.store.state.plans.find(function (p) { return p.id === b.dataset.edit; })));
          seg = editing.kind === 'deadline' ? 'deadline' : 'routine';
          PR.app.render();
        }
        if (b.dataset.del && confirm('삭제할까요? (기록은 유지됩니다)')) PR.actions.deletePlan(b.dataset.del);
        if (b.dataset.undone && confirm('완료를 취소할까요? 받은 포인트가 회수됩니다.')) PR.actions.uncompletePlan(b.dataset.undone);
      };

      /* T/Q 둘 다 입력 시 모드 선택 표시 */
      var tt = document.getElementById('f-tt');
      if (tt) {
        var updMode = function () {
          var both = document.getElementById('f-tt').value && document.getElementById('f-tq').value;
          document.getElementById('f-mode-wrap').classList.toggle('hidden', !both);
        };
        tt.oninput = updMode;
        document.getElementById('f-tq').oninput = updMode;
        updMode();
      }
    },

    onNavAway: function () {
      editing = null;
      ['habit', 'proj'].forEach(function (n) {
        var v = PR.app.views[n];
        if (v && v.onNavAway) v.onNavAway();
      });
    }
  });
})(window.PR = window.PR || {});

/* ===== components/projects.js ===== */
/* 프로젝트 탭: 마일스톤 관리 (계획 탭에서 분리) */
(function (PR) {
  'use strict';

  function projForm() {
    return '' +
      '<div class="card">' +
        '<div style="font-weight:700; margin-bottom:2px">🚩 새 프로젝트</div>' +
        '<div class="sub" style="margin-top:4px; line-height:1.6">크고 막연한 일을 단계로 쪼개세요. 단계에 총액의 60~70%, 완주 보너스에 30~40% 배분을 권장. 단계 포인트는 시작할 때 확정하는 게 원칙!</div>' +
        '<label>프로젝트 이름</label>' +
        '<input id="pj-title" placeholder="예: 포트폴리오 완성">' +
        '<div class="row">' +
          '<div class="grow"><label>완주 보너스 (P)</label>' +
            '<input id="pj-bonus" type="number" min="0" placeholder="예: 200"></div>' +
          '<div class="grow"><label>마감 (선택 · 조기 완주 보너스 ↑)</label>' +
            '<input id="pj-deadline" type="date"></div>' +
        '</div>' +
        '<label>단계 (마일스톤)</label>' +
        '<div id="pj-rows"></div>' +
        '<button type="button" id="pj-addrow" class="ghost small" style="margin-top:6px">+ 단계 추가</button>' +
        '<button id="pj-save" style="margin-top:12px; width:100%">프로젝트 시작</button>' +
      '</div>';
  }

  function projList() {
    var S = PR.store.state;
    if (!S.projects.length) return '<div class="card"><div class="empty">진행 중인 프로젝트가 없어요</div></div>';
    return S.projects.map(function (pj) {
      var doneN = pj.milestones.filter(function (m) { return m.done; }).length;
      var ms = pj.milestones.map(function (m) {
        return '<div class="hist"><span>' + (m.done ? '✅' : '⬜') + ' ' + PR.esc(m.title) + ' <span class="pts">+' + m.pts + 'P</span></span>' +
          (pj.done ? '' : (m.done
            ? '<button class="gray small" data-msundo="' + pj.id + ':' + m.id + '">취소</button>'
            : '<button class="small" data-msdo="' + pj.id + ':' + m.id + '">완료</button>')) +
        '</div>';
      }).join('');
      return '<div class="card">' +
        '<div class="row"><div class="grow">' +
          '<div class="t" style="font-weight:700">' + (pj.done ? '🏆 ' : '🚩 ') + PR.esc(pj.title) + '</div>' +
          '<div class="sub">완주 보너스 ' + pj.bonusPts + 'P' + (pj.deadline ? ' · 마감 ' + pj.deadline : '') + (pj.done ? ' · ' + pj.doneDate + ' 완주' : '') + '</div>' +
        '</div>' +
        '<button class="danger small" data-pjdel="' + pj.id + '">삭제</button></div>' +
        PR.vh.progressBar(doneN, pj.milestones.length) +
        '<div style="margin-top:6px">' + ms + '</div>' +
      '</div>';
    }).join('');
  }

  function addMsRow(container) {
    var row = document.createElement('div');
    row.className = 'row msrow';
    row.style.marginTop = '6px';
    row.innerHTML = '<input class="ms-title grow" placeholder="단계 이름">' +
      '<input class="ms-pts" type="number" min="1" placeholder="P" style="width:70px">' +
      '<button type="button" class="danger small ms-del">✕</button>';
    row.querySelector('.ms-del').onclick = function () { row.remove(); };
    container.appendChild(row);
  }

  function submitProject() {
    var title = document.getElementById('pj-title').value.trim();
    if (!title) { PR.toast('프로젝트 이름을 입력해 주세요'); return; }
    var ms = [];
    document.querySelectorAll('#pj-rows .msrow').forEach(function (row) {
      var t = row.querySelector('.ms-title').value.trim();
      var pts = Number(row.querySelector('.ms-pts').value);
      if (t && pts > 0) ms.push({ id: PR.uid(), title: t, pts: Math.round(pts), done: false, date: '' });
    });
    if (!ms.length) { PR.toast('단계를 1개 이상 입력해 주세요'); return; }
    PR.actions.saveProject({
      id: PR.uid(), title: title,
      bonusPts: Math.max(0, Number(document.getElementById('pj-bonus').value) || 0),
      deadline: document.getElementById('pj-deadline').value || '',
      createdAt: PR.todayStr(), done: false, doneDate: '',
      milestones: ms
    });
  }

  PR.app.register('proj', {
    render: function () {
      return '<h2>프로젝트</h2>' + projForm() + projList();
    },

    bind: function (root) {
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'pj-addrow') addMsRow(document.getElementById('pj-rows'));
        if (b.id === 'pj-save') submitProject();
        if (b.dataset.pjdel && confirm('이 프로젝트를 삭제할까요? (기록은 유지됩니다)')) PR.actions.deleteProject(b.dataset.pjdel);
        if (b.dataset.msdo) { var a = b.dataset.msdo.split(':'); PR.actions.completeMilestone(a[0], a[1]); }
        if (b.dataset.msundo && confirm('이 단계를 취소할까요? 받은 포인트가 회수됩니다.')) {
          var u = b.dataset.msundo.split(':'); PR.actions.uncompleteMilestone(u[0], u[1]);
        }
      };
      var rows = document.getElementById('pj-rows');
      if (rows && !rows.children.length) { addMsRow(rows); addMsRow(rows); addMsRow(rows); }
    }
  });
})(window.PR = window.PR || {});

/* ===== components/shop.js ===== */
/* 보상 탭: 내 사용권(티켓) → 보상 등록 → 보상 목록 → 사용 내역
   구매하면 사용권 1장이 발급되고, 실제로 누릴 때 '사용'을 눌러 소진한다.
   다회성 보상은 티켓이 여러 장 쌓이고, 1회성은 티켓이 있는 동안 잠긴다. */
(function (PR) {
  'use strict';

  /* 미사용 티켓을 보상별로 묶기 (같은 보상은 ×N) — 오래된 것부터 사용(FIFO) */
  function ticketGroups() {
    var open = PR.store.state.purchases.filter(function (p) { return !p.used; });
    var order = [];
    var by = {};
    open.forEach(function (t) {
      var k = t.rewardId || ('name:' + t.name);
      if (!by[k]) { by[k] = { key: k, name: t.name, cost: t.cost, items: [] }; order.push(k); }
      by[k].items.push(t);
    });
    return order.map(function (k) { return by[k]; });
  }

  function ticketCard() {
    var groups = ticketGroups();
    if (!groups.length) return '';
    var n = groups.reduce(function (a, g) { return a + g.items.length; }, 0);
    var rows = groups.map(function (g) {
      var first = g.items[0]; // 가장 먼저 산 티켓부터 사용
      return '<div class="plan">' +
        '<div class="grow"><div class="t">🎟 ' + PR.esc(g.name) +
          (g.items.length > 1 ? ' <span class="chip d1">×' + g.items.length + '</span>' : '') + '</div>' +
          '<div class="sub">' + first.date + ' 구매 · ' + g.cost.toLocaleString() + 'P</div></div>' +
        '<button class="small" data-use="' + first.id + '">사용</button>' +
        '<button class="ghost small" data-refund="' + first.id + '">환불</button>' +
      '</div>';
    }).join('');
    return '<div class="card">' +
      '<div style="font-weight:700">🎟 내 사용권 (' + n + '장)</div>' +
      '<div class="sub" style="margin-top:2px">사 두고 아껴 뒀다가, 누릴 때 눌러서 사용하세요</div>' +
      '<div style="margin-top:8px">' + rows + '</div>' +
    '</div>';
  }

  function formCard() {
    return '<div class="card">' +
      '<div style="font-weight:700">🎁 보상 등록</div>' +
      '<label>보상 이름</label><input id="r-name" placeholder="예: 유튜브 30분, 치킨 시키기, 게임 1시간">' +
      '<label>가격 (P)</label><input id="r-cost" type="number" min="1" placeholder="100">' +
      '<label>구매 방식</label>' +
      '<div class="row">' +
        '<button type="button" class="grow" id="r-many">🔁 여러 번</button>' +
        '<button type="button" class="grow gray" id="r-once">1️⃣ 한 번만</button>' +
      '</div>' +
      '<div class="sub" style="margin-top:4px">여러 번: 살 때마다 사용권이 쌓여요 · 한 번만: 딱 한 장만 살 수 있어요</div>' +
      '<button id="r-add" style="margin-top:10px; width:100%">등록</button>' +
    '</div>';
  }

  function listCard() {
    var S = PR.store.state;
    if (!S.rewards.length) {
      return '<div class="card"><div class="empty">보상을 등록해 보세요!<br>동기부여가 되는 것일수록 좋아요 🎯</div></div>';
    }
    var rows = S.rewards.map(function (r) {
      var sold = PR.actions.isSoldOut(r);
      var kind = r.once
        ? '<span class="chip" style="background:#fdf0e8;color:#d97706">한 번만</span>'
        : '<span class="chip" style="background:#f0f0f5;color:#999">여러 번</span>';
      var held = S.purchases.filter(function (x) { return x.rewardId === r.id && !x.used; }).length;
      return '<div class="plan ' + (sold ? 'done' : '') + '">' +
        '<div class="grow"><div class="t">' + PR.esc(r.name) + ' ' + kind +
          (held ? ' <span class="chip d1">사용권 ' + held + '장</span>' : '') + '</div>' +
          '<div class="sub pts">' + r.cost.toLocaleString() + ' P</div></div>' +
        (sold
          ? '<button class="gray small" disabled>구매함</button>'
          : '<button class="small" data-buy="' + r.id + '"' + (S.points < r.cost ? ' disabled' : '') + '>구매</button>') +
        '<button class="danger small" data-rdel="' + r.id + '">✕</button>' +
      '</div>';
    }).join('');
    return '<div class="card">' + rows + '</div>';
  }

  function historyCard() {
    var used = PR.store.state.purchases.filter(function (p) { return p.used; });
    if (!used.length) return '';
    var rows = used.slice().reverse().slice(0, 30).map(function (h) {
      return '<div class="hist"><span>🛍 ' + PR.esc(h.name) + '</span>' +
        '<span class="sub">' + (h.usedAt || h.date) + ' 사용 · -' + h.cost + 'P ' +
        '<button class="ghost small" data-unuse="' + h.id + '">되돌리기</button></span></div>';
    }).join('');
    return '<div class="card"><details><summary>사용 내역 (' + used.length + ')</summary>' + rows + '</details></div>';
  }

  PR.app.register('shop', {
    render: function () {
      return '<h2>보상 상점</h2>' + ticketCard() + formCard() + listCard() + historyCard();
    },

    bind: function (root) {
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;

        /* 구매 방식 토글 (선택된 쪽이 진하게) */
        if (b.id === 'r-many' || b.id === 'r-once') {
          var once = b.id === 'r-once';
          document.getElementById('r-many').className = 'grow ' + (once ? 'gray' : '');
          document.getElementById('r-once').className = 'grow ' + (once ? '' : 'gray');
          return;
        }
        if (b.id === 'r-add') {
          var name = document.getElementById('r-name').value.trim();
          var cost = Math.max(1, Number(document.getElementById('r-cost').value) || 0);
          if (!name || !cost) { PR.toast('이름과 가격을 입력해 주세요'); return; }
          var isOnce = !document.getElementById('r-once').classList.contains('gray');
          PR.actions.addReward(name, cost, isOnce);
          return;
        }
        if (b.dataset.buy) {
          var r = PR.store.state.rewards.find(function (x) { return x.id === b.dataset.buy; });
          if (r && confirm('"' + r.name + '" 을(를) ' + r.cost + 'P로 구매할까요?\n사용권 1장이 발급돼요.')) {
            PR.actions.buyReward(b.dataset.buy);
          }
          return;
        }
        if (b.dataset.use) {
          var t = PR.store.state.purchases.find(function (x) { return x.id === b.dataset.use; });
          if (t && confirm('"' + t.name + '" 사용권을 지금 쓸까요?')) PR.actions.useTicket(b.dataset.use);
          return;
        }
        if (b.dataset.refund && confirm('아직 안 쓴 사용권을 환불할까요? 포인트를 돌려받아요.')) {
          PR.actions.refundTicket(b.dataset.refund);
          return;
        }
        if (b.dataset.unuse && confirm('사용을 취소하고 사용권으로 되돌릴까요?')) {
          PR.actions.unuseTicket(b.dataset.unuse);
          return;
        }
        if (b.dataset.rdel && confirm('이 보상을 삭제할까요? (이미 산 사용권은 그대로 남아요)')) {
          PR.actions.deleteReward(b.dataset.rdel);
        }
      };
    }
  });
})(window.PR = window.PR || {});

/* ===== components/stats.js ===== */
/* 통계 탭: 7일 그래프 + 30일 달성률 + 요약 */
(function (PR) {
  'use strict';

  PR.app.register('stats', {
    render: function () {
      var S = PR.store.state;

      /* 최근 7일 포인트 (마일스톤/완주 보너스/페널티 포함 = 순증감) */
      var days = [];
      for (var i = 6; i >= 0; i--) {
        var d = new Date(); d.setDate(d.getDate() - i);
        days.push(PR.todayStr(d));
      }
      var daily = days.map(function (ds) {
        return S.logs.filter(function (l) { return l.date === ds; })
          .reduce(function (a, l) { return a + l.pts; }, 0);
      });
      var max = Math.max.apply(null, daily.concat([10]));
      var W = 480, H = 170, bw = W / 7;
      var bars = daily.map(function (v, i) {
        var h = v / max * 120;
        var dd = new Date(days[i] + 'T12:00:00');
        return '<rect x="' + (i * bw + 10) + '" y="' + (140 - h) + '" width="' + (bw - 20) + '" height="' + Math.max(h, 2) + '" rx="6" fill="' + (i === 6 ? 'var(--accent)' : '#c9cbee') + '"/>' +
          '<text x="' + (i * bw + bw / 2) + '" y="' + (132 - h) + '" text-anchor="middle" font-size="11" fill="#888">' + (v || '') + '</text>' +
          '<text x="' + (i * bw + bw / 2) + '" y="160" text-anchor="middle" font-size="11" fill="#aaa">' + (dd.getMonth() + 1) + '/' + dd.getDate() + '</text>';
      }).join('');

      /* 30일 달성률 — 완전 달성만 인정 */
      var sched = 0, done = 0;
      /* 요일 고정(습관/반복): 일 단위 */
      for (var j = 0; j < 30; j++) {
        var d2 = new Date(); d2.setDate(d2.getDate() - j);
        var ds2 = PR.todayStr(d2);
        S.plans.forEach(function (p) {
          if ((p.kind !== 'habit' && p.kind !== 'routine') || (p.freq && p.freq.type === 'weekly')) return;
          if (!PR.sched.isScheduledOn(p, ds2)) return;
          sched++;
          if (S.logs.some(function (l) { return l.planId === p.id && l.date === ds2 && l.full; })) done++;
        });
      }
      /* 주 n회(습관/반복): 주 단위 (최근 4주) */
      for (var w = 0; w < 4; w++) {
        var wd = new Date(); wd.setDate(wd.getDate() - w * 7);
        var wk = PR.weekKey(PR.todayStr(wd));
        S.plans.forEach(function (p) {
          if ((p.kind !== 'habit' && p.kind !== 'routine') || !p.freq || p.freq.type !== 'weekly') return;
          sched += p.freq.n;
          done += Math.min(PR.sched.weekFullCount(p.id, wk), p.freq.n);
        });
      }
      var rate = sched ? Math.round(done / sched * 100) : 0;
      var weekPts = daily.reduce(function (a, b) { return a + b; }, 0);
      var spent = S.purchases.reduce(function (a, p) { return a + p.cost; }, 0);
      var pjDone = S.projects.filter(function (p) { return p.done; }).length;
      var completions = S.logs.filter(function (l) { return !l.penalty; }).length; // 페널티 로그 제외
      var docked = S.logs.filter(function (l) { return l.penalty; }).reduce(function (a, l) { return a - l.pts; }, 0);

      return '<h2>통계</h2>' +
        '<div class="stat3">' +
          '<div class="card"><div class="n">' + rate + '%</div><div class="sub">30일 달성률</div></div>' +
          '<div class="card"><div class="n pts">' + weekPts + '</div><div class="sub">7일 획득 P</div></div>' +
          '<div class="card"><div class="n">' + completions + '</div><div class="sub">총 완료 횟수</div></div>' +
        '</div>' +
        '<div class="card" style="margin-top:10px">' +
          '<div style="font-weight:700; margin-bottom:6px">최근 7일 획득 포인트</div>' +
          '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%">' + bars + '</svg>' +
        '</div>' +
        '<div class="card">' +
          '<div class="hist"><span>🔥 현재 스트릭</span><b>' + PR.points.computeStreak(false) + '일</b></div>' +
          '<div class="hist"><span>🏆 최고 스트릭</span><b>' + S.bestStreak + '일</b></div>' +
          '<div class="hist"><span>🛡 방어막</span><b>' + (S.freezes || 0) + '개</b></div>' +
          '<div class="hist"><span>🚩 완주한 프로젝트</span><b>' + pjDone + '개</b></div>' +
          '<div class="hist"><span>💰 누적 획득</span><b>' + S.earned.toLocaleString() + 'P</b></div>' +
          '<div class="hist"><span>🛍 보상에 사용</span><b>' + spent.toLocaleString() + 'P</b></div>' +
          (docked ? '<div class="hist"><span>🥶 놓쳐서 차감</span><b>' + docked.toLocaleString() + 'P</b></div>' : '') +
        '</div>';
    }
  });
})(window.PR = window.PR || {});

/* ===== components/calendar.js ===== */
/* 달력 탭: 월간 예정 + 달성 기록. 날짜를 누르면 그날 상세 */
(function (PR) {
  'use strict';

  var cur = null;      // {y, m} 표시 중인 달
  var selected = null; // 선택된 날짜 'YYYY-MM-DD'

  function initState() {
    if (!cur) {
      var n = new Date();
      cur = { y: n.getFullYear(), m: n.getMonth() };
      selected = PR.todayStr();
    }
  }

  /* 해당 날짜의 예정/기록 요약 */
  function dayInfo(ds) {
    var S = PR.store.state;
    var due = S.plans.filter(function (p) { return PR.sched.isScheduledOn(p, ds); });
    /* 주 n회형은 특정 날짜의 약속이 아니므로 예정 점 대상에서 제외 */
    var dueFixed = due.filter(function (p) { return !p.freq || p.freq.type !== 'weekly'; });
    var dls = S.plans.filter(function (p) { return p.kind === 'deadline' && p.active && p.deadline === ds; });
    var pjs = S.projects.filter(function (pj) { return pj.deadline === ds; });
    var doneIds = {};
    S.logs.forEach(function (l) { if (l.date === ds && l.full) doneIds[l.planId] = 1; });
    var adhoc = S.logs.filter(function (l) { return l.adhoc && l.date === ds; });
    var frozen = (S.frozenDates || []).indexOf(ds) !== -1;
    return { due: due, dueFixed: dueFixed, dls: dls, pjs: pjs, doneIds: doneIds, adhoc: adhoc, frozen: frozen };
  }

  function cellHtml(ds, dayNum) {
    var today = PR.todayStr();
    var info = dayInfo(ds);
    var cls = 'cal-cell';
    if (ds === today) cls += ' today';
    if (ds === selected) cls += ' sel';
    if (ds < today) { // 지난 날: 결과 색
      if (info.frozen) cls += ' frozen';
      else if (PR.points.metOn(ds)) cls += ' ok';
      else if (PR.points.obligationOn(ds)) cls += ' miss';
    }
    var dots = '';
    if (info.dueFixed.length) dots += '<span class="cd"></span>';
    if (info.dls.length || info.pjs.length) { // 마감일: 미완료 금색 / 전부 완료 초록
      var allDone = info.dls.every(function (x) { return x.done; }) && info.pjs.every(function (x) { return x.done; });
      dots += '<span class="cd ' + (allDone ? 'dld' : 'dl') + '"></span>';
    }
    return '<button class="' + cls + '" data-day="' + ds + '">' + dayNum +
      '<span class="cdots">' + dots + '</span></button>';
  }

  function detailHtml(ds) {
    var S = PR.store.state;
    var today = PR.todayStr();
    var info = dayInfo(ds);
    var d = new Date(ds + 'T12:00:00');
    var rows = [];

    if (info.frozen) rows.push('<div class="hist"><span>🛡 방어막으로 보호된 날</span></div>');
    info.pjs.forEach(function (pj) {
      rows.push('<div class="hist"><span>🚩 프로젝트 마감: <b>' + PR.esc(pj.title) + '</b></span>' +
        (pj.done ? '<span class="chip d1">완주 ✓</span>' : '') + '</div>');
    });
    info.dls.forEach(function (p) {
      rows.push('<div class="hist"><span>📌 마감: <b>' + PR.esc(p.title) + '</b> <span class="pts">' + p.basePts + 'P</span></span>' +
        (p.done ? '<span class="chip d1">완료 ✓</span>' : (ds < today ? '<span class="chip d3">미완료</span>' : '')) + '</div>');
    });
    info.due.forEach(function (p) {
      var weekly = p.freq && p.freq.type === 'weekly';
      var did = !!info.doneIds[p.id];
      /* 주 n회: 특정일 약속이 아니므로 미래엔 표시 안 함, 과거엔 실제로 한 날만 ✓ */
      if (weekly && ds > today) return;
      if (weekly && ds < today && !did) return;
      var icon = p.kind === 'habit' ? '🌱' : '🔁';
      var mark = '';
      if (ds <= today) mark = did ? '<span class="chip d1">✓</span>'
        : (ds < today && !weekly ? '<span class="chip" style="background:#f0f0f5;color:#999">✗</span>' : '');
      rows.push('<div class="hist"><span>' + icon + ' ' + PR.esc(p.title) +
        (p.duty ? ' <span class="chip" style="background:#e8e8ee;color:#777">의무</span>' : '') + '</span>' + mark + '</div>');
    });
    info.adhoc.forEach(function (l) {
      rows.push('<div class="hist"><span>🔖 ' + PR.esc(l.title || '') + '</span><span class="pts">+' + l.pts + 'P</span></div>');
    });
    var dayPts = S.logs.filter(function (l) { return l.date === ds; })
      .reduce(function (a, l) { return a + l.pts; }, 0);

    return '<div class="card">' +
      '<div class="row"><div class="grow" style="font-weight:700">' +
        (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + PR.DAYS[d.getDay()] + ')' +
        (ds === today ? ' <span class="chip">오늘</span>' : '') + '</div>' +
        (dayPts ? '<span class="pts">' + (dayPts > 0 ? '+' : '') + dayPts + 'P</span>' : '') + '</div>' +
      (rows.length ? '<div style="margin-top:6px">' + rows.join('') + '</div>'
        : '<div class="empty" style="padding:14px 0">이날은 예정도 기록도 없어요</div>') +
    '</div>';
  }

  PR.app.register('cal', {
    render: function () {
      initState();
      var first = new Date(cur.y, cur.m, 1);
      var startWd = first.getDay();
      var dim = new Date(cur.y, cur.m + 1, 0).getDate();

      var head = '<div class="calhead">' +
        '<button class="ghost small" data-cal="prev">‹</button>' +
        '<div style="font-weight:700">' + cur.y + '년 ' + (cur.m + 1) + '월</div>' +
        '<div class="row"><button class="ghost small" data-cal="now">오늘</button>' +
        '<button class="ghost small" data-cal="next">›</button></div></div>';

      var grid = '<div class="calgrid">' +
        PR.DAYS.map(function (w) { return '<div class="calwd">' + w + '</div>'; }).join('');
      for (var b = 0; b < startWd; b++) grid += '<div class="cal-cell blank"></div>';
      for (var day = 1; day <= dim; day++) {
        var ds = cur.y + '-' + String(cur.m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        grid += cellHtml(ds, day);
      }
      grid += '</div>';

      var legend = '<div class="sub" style="margin-top:8px">' +
        '<span class="cal-lg ok"></span>달성 <span class="cal-lg miss"></span>놓침 ' +
        '<span class="cal-lg frozen"></span>방어막 · <span class="cd" style="display:inline-block"></span> 예정 ' +
        '<span class="cd dl" style="display:inline-block"></span> 마감 <span class="cd dld" style="display:inline-block"></span> 마감 완료</div>';

      return '<h2>달력</h2><div class="card">' + head + grid + legend + '</div>' + detailHtml(selected);
    },

    bind: function (root) {
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.day) { selected = b.dataset.day; PR.app.render(); return; }
        if (b.dataset.cal === 'prev') { cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; } PR.app.render(); }
        if (b.dataset.cal === 'next') { cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; } PR.app.render(); }
        if (b.dataset.cal === 'now') {
          var n = new Date();
          cur = { y: n.getFullYear(), m: n.getMonth() };
          selected = PR.todayStr();
          PR.app.render();
        }
      };
    }
  });
})(window.PR = window.PR || {});

          '의무 항목은 스트릭 카운트에서 제외') +
        block('🧭 계획 종류',
          '· 📅 1회성: 마감일이 있는 목표. 일찍 끝낼수록 보너스↑, 지나면 지급 50%<br>' +
          '· 🔁 반복: 요일 고정 또는 주 n회 반복하는 일<br>' +
          '· 🌱 습관: 정해진 시각 없이 주기적으로. 단순 O/X 체크<br>' +
          '· 🚩 프로젝트: 여러 단계로 나눠 진행하는 큰 일') +
        block('⏱ 목표·수행 시간대',
          '· 목표를 비우면 O/X 체크로 처리<br>' +
          '· 시간·분량을 둘 다 입력하면 달성 기준(OR/AND) 선택<br>' +
          '· 수행 시간대 안에 완료하면 정시 보너스 +30%<br>' +

          '· 습관은 지난 날도 체크 가능 (소급은 보너스 없이 지급)');
    }
  });
})(window.PR = window.PR || {});

/* ===== components/more.js ===== */
/* 더보기 탭: [통계 | 설정] — 기존 stats/setting 뷰에 위임 */
(function (PR) {
  'use strict';

  var seg = 'stats';

  PR.app.register('more', {
    render: function () {
      var segBtns = '<div class="row" style="margin-bottom:10px; margin-top:14px">' +
        '<button class="grow small ' + (seg === 'stats' ? '' : 'gray') + '" data-mseg="stats">📊 통계</button>' +
        '<button class="grow small ' + (seg === 'setting' ? '' : 'gray') + '" data-mseg="setting">⚙️ 설정</button>' +
        '<button class="grow small ' + (seg === 'help' ? '' : 'gray') + '" data-mseg="help">❓ 도움말</button></div>';
      return segBtns + PR.app.views[seg].render();
    },

    bind: function (root) {
      var v = PR.app.views[seg];
      if (v && v.bind) v.bind(root);
      var sub = root.onclick;
      root.onclick = function (e) {
        var b = e.target.closest('button');
        if (b && b.dataset.mseg) { seg = b.dataset.mseg; PR.app.render(); return; }
        if (sub) sub(e);
      };
    }
  });
})(window.PR = window.PR || {});

/* ===== core/boot.js ===== */
/* 부트스트랩: 모든 컴포넌트 등록 후 앱 시작 */
(function (PR) {
  'use strict';
  PR.app.init();
})(window.PR = window.PR || {});
</script>
